<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NICE — Log in</title>
  <meta name="description" content="NICE demo clone — photo sharing app demo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237b2ff7'/%3E%3Cstop offset='1' stop-color='%23f107a3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div id="frame">

    <!-- ======= LOGIN ======= -->
    <main class="auth-screen">
      <div class="auth-hero">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="72" height="72">
            <defs>
              <linearGradient id="logog" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7b2ff7"/><stop offset="1" stop-color="#f107a3"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="18" fill="url(#logog)"/>
            <path d="M20 45V19h5.2l12.4 17.6V19H43v26h-5.2L25.4 27.4V45Z" fill="#fff"/>
          </svg>
        </div>
        <h1 class="logo-word">NICE</h1>
        <p class="tagline">Share your nice moments</p>
      </div>

      <form id="login-form" novalidate>
        <!-- phone -->
        <div class="field">
          <span class="f-ic" data-icon="phone"></span>
          <span class="cc">(+94)</span>
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel"
                 placeholder="7X XXX XXXX" maxlength="12" aria-label="Phone number">
        </div>

        <!-- password -->
        <div class="field">
          <span class="f-ic" data-icon="lock"></span>
          <input id="password" type="password" autocomplete="current-password"
                 placeholder="Password" aria-label="Password">
          <button type="button" class="eye" id="toggle-pw" aria-label="Show password"></button>
        </div>

        <label class="check-row">
          <input type="checkbox" id="remember">
          <span class="box"></span>
          <span>Remember username/password</span>
        </label>

        <div class="form-error" id="login-error" hidden></div>

        <button type="submit" class="btn-primary">Log in now</button>

        <p class="swap-link">No account?
          <a href="register.html">Register</a>
        </p>
      </form>

      <p class="agree">
        <label class="check-row small">
          <input type="checkbox" id="agree" checked>
          <span class="box"></span>
          <span>Agree to our
            <a href="#" data-doc="terms">《User Agreement》</a>and
            <a href="#" data-doc="privacy">《Privacy Policy》</a>
          </span>
        </label>
      </p>

      <!-- demo credentials helper -->
      <div class="demo-card">
        <div class="demo-head">
          <span class="demo-pill">DEMO</span>
          <span>Demo credentials</span>
        </div>
        <div class="demo-rows">
          <div class="demo-row"><span>Phone</span><code id="demo-phone">071 234 5678</code></div>
          <div class="demo-row"><span>Password</span><code id="demo-pw">demo1234</code></div>
        </div>
        <button type="button" class="btn-ghost" id="fill-demo">Fill demo credentials</button>
      </div>
    </main>

    <p class="page-foot">Demo recreation for educational purposes · not affiliated with nicemktlk.com</p>
  </div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
